name: LLM Release Gates

on: [pull_request]

jobs:
  schema-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: pip install pytest jsonschema pyyaml
      - name: Schema Validation Gate
        run: python -m pytest testsLLM/test_golden.py -v

  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: pip install pytest pyyaml
      - name: Safety / Refusal Gate
        run: python -m pytest testsLLM/test_redteam.py -v

  tool-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: pip install pytest pyyaml
      - name: Tool Use Gate
        run: python -m pytest testsLLM/test_tool_gate.py -v