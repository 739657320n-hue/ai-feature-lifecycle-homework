name: LLM Gates

on:
  push:
    branches: [ dev-homework ]
  pull_request:
    branches: [ main ]

jobs:
  llm-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Python Dependencies
        run: make setup

      - name: schema-gate
        run: make schema-gate

      - name: safety-gate
        run: make safety-tests

      - name: tool-gate
        run: make tool-gate