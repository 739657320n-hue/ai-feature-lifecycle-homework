name: Safety Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'specs/**'

jobs:
  safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest pyyaml
          # Optional: install gitleaks
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.16.0/gitleaks_8.16.0_linux_amd64.tar.gz
          tar -xzf gitleaks_8.16.0_linux_amd64.tar.gz -C /usr/local/bin

      - name: Secret scan with gitleaks
        run: gitleaks detect --source . --no-git --verbose

      - name: Run pytest safety tests
        run: |
          python -m pytest tests/test_safety.py -v