name: Safety Tests

on:
  push:
    branches: [ dev-homework ]
  pull_request:
    branches: [ main ]

jobs:
  safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: make setup

      - name: Install gitleaks (via apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gitleaks

      - name: Secret scan with gitleaks
        run: gitleaks detect --source . --no-git --verbose

      - name: Run pytest safety tests
        run: make safety-tests