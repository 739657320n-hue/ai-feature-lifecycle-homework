name: Evaluation Gate

on:
  push:
    branches: [ dev-homework ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-models:
    runs-on: ubuntu-latest
    name: Evaluate Music Generation Models

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: make setup

      - name: Run Evaluation Gate
        run: make eval-gate

      - name: Generate Evaluation Summary
        if: always()
        run: |
          echo "EVALUATION GATE SUMMARY" > summary.txt
          echo "=======================" >> summary.txt
          echo "Date: $(date)" >> summary.txt
          echo "Workflow: ${{ github.workflow }}" >> summary.txt
          echo "Run ID: ${{ github.run_id }}" >> summary.txt
          echo "" >> summary.txt

          if [ -f "reports/metrics.json" ]; then
            echo "Evaluation completed successfully." >> summary.txt
            echo "Results saved to reports/metrics.json" >> summary.txt
          else
            echo "Evaluation failed to produce metrics file." >> summary.txt
          fi

          cat summary.txt

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-summary
          path: summary.txt