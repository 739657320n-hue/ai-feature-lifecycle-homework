name: Music Generation - HW3 Data Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Step 2: Setup Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          pip install pandas numpy pytest
      
      # Step 4: Generate sample data (20 music segments)
      - name: Generate Sample Data
        run: |
          echo "Generating 20 music segments..."
          python data/generate_music_data.py
      
      # Step 5: Run data quality checks
      - name: Run Data Quality Tests
        run: |
          echo "Running data quality checks..."
          python tests/test_data_checks.py
      
      # Step 6: Upload data as artifact
      - name: Upload Data Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hw3-data-artifacts
          path: |
            data/raw/audio_features.csv
            data/raw/note_sequences.jsonl
            data/splits/
      
      # Step 7: Upload test report
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
