name: SLO Gate

on:
  push:
    branches: [ dev-homework ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate_slo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: make setup

      - name: slo_gate
        run: make slo-gate
